services:
  - type: web
    name: florida-hortifruti-api
    runtime: node
    region: ohio
    plan: starter
    rootDir: florida-hortifruti
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: florida-hortifruti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PORT
        value: 3000
      - key: APP_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: florida-hortifruti-db
    databaseName: florida_hortifruti
    user: florida
    plan: basic
