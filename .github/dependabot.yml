# Abre PRs semanais com atualizações de segurança/versão, para as vulnerabilidades não voltarem a acumular
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /florida-hortifruti
      - /florida-hortifruti-admin
      - /florida-hortifruti-vendedor
      - /florida-hortifruti-cliente
      - /florida-hortifruti-motorista
      - /florida-hortifruti-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
